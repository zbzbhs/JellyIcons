name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 全部单测都不依赖真实桌面 / 声卡，但代码里 import 了 Windows-only 的
    # ctypes.WinDLL，所以必须跑在 windows 上。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Lint (pyflakes)
        # 必须用 bash：pwsh 不展开 glob，python -m pyflakes *.py 会拿到字面量
        shell: bash
        run: python -m pyflakes jellyicons/*.py *.py tests/*.py

      - name: Unit tests + smoke
        run: python -X utf8 run_tests.py

  package-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Launcher scripts are GBK-encoded (cmd parses them as GBK)
        shell: pwsh
        run: |
          foreach ($f in @("启动.bat", "诊断.bat")) {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            # 0xEF 0xBB 0xBF 是 UTF-8 BOM；出现就说明又被编辑器存成 UTF-8 了
            if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB) {
              throw "$f 是 UTF-8 BOM，cmd 会按 GBK 解析成乱码命令"
            }
            $text = [System.Text.Encoding]::GetEncoding(936).GetString($bytes)
            if ($text -notmatch "run\.py") {
              throw "$f 里找不到 run.py，脚本可能损坏"
            }
          }
          Write-Host "launcher encoding OK"
      - name: Imports resolve
        run: python -c "import jellyicons.app, jellyicons.audio_engine, jellyicons.overlay; print('imports OK')"
